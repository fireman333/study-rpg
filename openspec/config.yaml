# OpenSpec config.yaml — generated by /spec init, repaired for CLI 1.3.0 schema.
# Reference: https://github.com/Fission-AI/OpenSpec
#
# Schema (enforced by openspec >= 1.3.0):
#   context: <string>                     literal text injected into AI prompts (< 50 KB)
#   rules:   <map artifact_id -> [str]>   artifact_id ∈ {proposal, specs, design, tasks}
#
# `context` is intentionally omitted: openspec/project.md is already injected
# into every Claude Code session via the project CLAUDE.md `@openspec/project.md`
# import (see ~/.claude/imports/claude_md_inheritance.md). Re-injecting it here
# duplicates ~10 KB into every artifact prompt for no extra signal.

schema: spec-driven

rules:
  # === proposal ===
  proposal:
    - "Ask all clarifying questions, AskUserQuestion options, and user-facing explanations in 繁體中文 (Traditional Chinese). Keep medical / statistical / code terms and RFC 2119 normative keywords (SHALL / MUST, WHEN / THEN) in English."
    - "Never run `git commit` automatically. All commits go through the user via the auto-git skill or explicit confirmation."
    - "For any non-trivial decision (architecture, library choice, naming convention, scope cut), use AskUserQuestion before writing it into a proposal/spec."
    - "Do not implement code changes without first running /opsx:propose for the change. The propose -> apply -> verify -> archive sequence is mandatory for any change touching openspec/specs/."
    - "All loot / gacha rolls must be triggered by gameplay actions (read time / quiz / boss). Do not introduce IAP, real-money, ad-rewards, or any monetary path to rolls — hard product principle, not just a roadmap item."
    - "Never write real patient identifiers into openspec/. (Not applicable to past exam questions content; rule kept for forks that may add clinical case content packs.)"
    - "If project contains research_plan.json at root, halt OpenSpec workflow and suggest /research-plan instead."
    - "If project contains 01_protocol/ + 09_qa/ at root, halt and suggest /ma-end-to-end."

  # === specs ===
  specs:
    - "For any non-trivial decision (architecture, library choice, naming convention, scope cut), use AskUserQuestion before writing it into a proposal/spec."
    - "Engine API surface (ContentPack / ThemePack / Question / Subject / Item interfaces in packages/core/src/types.ts) is the contract for third-party forks. Treat any breaking change to these types as MAJOR and require a CHANGELOG entry."
    - "packages/core/ must remain content-agnostic. Medical terms (科目, 知識力, 白袍 etc.) belong in packages/theme-pixel-medical/ or packages/content-medexam-tw/, never in core."
    - "All loot / gacha rolls must be triggered by gameplay actions. Do not introduce IAP, real-money, ad-rewards, or any monetary path to rolls."
    - "Every Question card UI must display 陽明國考考古題小組 attribution + source URL inline. Removing this requires written permission from the source; default is to keep it."
    - "Never write real patient identifiers into openspec/."

  # === design ===
  design:
    - "For any non-trivial decision (architecture, library choice, naming convention, scope cut), use AskUserQuestion before writing it into a proposal/spec."
    - "Engine API surface (ContentPack / ThemePack / Question / Subject / Item interfaces in packages/core/src/types.ts) is the contract for third-party forks. Treat any breaking change to these types as MAJOR and require a CHANGELOG entry."
    - "packages/core/ must remain content-agnostic. Medical terms (科目, 知識力, 白袍 etc.) belong in packages/theme-pixel-medical/ or packages/content-medexam-tw/, never in core."
    - "Never write real patient identifiers into openspec/."

  # === tasks ===
  tasks:
    - "Never run `git commit` automatically. All commits go through the user via the auto-git skill or explicit confirmation."
    - "Do not implement code changes without first running /opsx:propose for the change."
    - "Do not archive a change before /opsx:verify reports green on completeness / correctness / coherence."
    - "Never write real patient identifiers into openspec/."

# Project defaults (informational; OpenSpec CLI doesn't currently consume these,
# but kept as documentation for human / Claude reference).
defaults:
  requirement_keyword: SHALL
  scenario_format: bdd
  capability_slug_case: kebab
  change_slug_pattern: "<verb>-<object>"
