name: Deploy Cloudflare Worker

# Deploys `study-rpg-sync-worker` (R2 auth-bridging presigner) when its source
# changes on main. See cloudflare/sync-worker/README.md for deploy semantics +
# secret rotation.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CF_API_TOKEN     Cloudflare API token. Scopes: Workers Scripts:Edit + Workers R2 Storage:Edit (study-rpg-saves + study-rpg-saves-backup).
#   CF_ACCOUNT_ID    Cloudflare account ID (from any dashboard sidebar).
#   R2_SNAPSHOT_ACCESS_KEY_ID / R2_SNAPSHOT_SECRET_ACCESS_KEY
#                    R2 S3 token (Object Read & Write, study-rpg-saves + study-rpg-saves-backup only)
#                    for the pre-deploy save snapshot (scripts/r2-snapshot.sh).
#
# Worker secrets (SUPABASE_JWKS_URL / R2_S3_ACCESS_KEY_ID / etc.) are managed
# via `wrangler secret put` directly against the live Worker — NOT exposed
# through GitHub. This workflow only deploys code; secrets persist across deploys.

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/sync-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Typecheck Worker
        run: pnpm --filter @study-rpg/sync-worker typecheck

      - name: Snapshot player cloud saves (pre-deploy, change fit-sync-worker-under-free-plan-cpu-limit)
        # Server-side R2→R2 copy of users/* into study-rpg-saves-backup/backup/<ts>/. A failed snapshot
        # fails the job before anything is published. Retention is the bucket lifecycle rule (30 days).
        run: |
          sudo apt-get install -y -q rclone >/dev/null
          bash scripts/r2-snapshot.sh
        env:
          R2_SNAPSHOT_ACCESS_KEY_ID: ${{ secrets.R2_SNAPSHOT_ACCESS_KEY_ID }}
          R2_SNAPSHOT_SECRET_ACCESS_KEY: ${{ secrets.R2_SNAPSHOT_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: cloudflare/sync-worker
          packageManager: pnpm
