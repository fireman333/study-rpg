name: Deploy Cloudflare Pages

# Deploys the combined CF Pages project (med-study-rpg.com/neurons/ + root
# landing) when main updates. 二階 (/2nd/) ships from its own standalone repo
# + CF project (med-study-rpg-2nd), fronted by the edge-router Worker on
# med-study-rpg.com/2nd/* — it is NOT built here (split-medexam2-standalone §5).
# 一階 (/1st/) was removed and GitHub Pages fully retired
# (remove-medexam-tw-and-promote-neurons), so this is now the ONLY deploy
# workflow for the in-repo app shell.
# The CF Pages project is configured in **Direct Upload** mode (Git Provider:
# No), so the dashboard does NOT auto-deploy on git push — this workflow is
# what bridges the gap.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CF_API_TOKEN     Cloudflare API token. Scopes needed for THIS workflow:
#                    Pages:Edit (in addition to the Worker scopes already
#                    used by deploy-worker.yml). Regenerate token in CF
#                    dashboard → My Profile → API Tokens if missing.
#   CF_ACCOUNT_ID    Cloudflare account ID (already set for deploy-worker.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # neurons-tw is the canonical app (M_3rd, promoted 2026-06-03). It ships
      # Google sign-in + R2 cloud sync + leaderboard + achievements, so the
      # Supabase + Worker env MUST be baked at build time. Without
      # VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY, getSupabase() returns null
      # → cloud sync disabled and the sign-in UI never renders in prod
      # (fixed 2026-06-03; the prior step only passed VITE_DEPLOY_BASE +
      # VITE_COMMIT_SHA from when neurons was an auth-less scaffold).
      # Neurons sync is R2-only (fixed 'neurons' bundle) and does NOT read
      # VITE_CLOUD_SYNC_BACKEND / VITE_CLOUD_SYNC_READ_BACKEND, so those are
      # intentionally omitted.
      - name: Build neurons-tw for /neurons/
        env:
          VITE_DEPLOY_BASE: /neurons/
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLOUD_SYNC_ENABLED: 'true'
          VITE_SYNC_WORKER_URL: https://api.med-study-rpg.com
          # Lofi 電台 BGM base — R2 custom domain (add-neurons-lofi-radio). NON-secret
          # public URL; MUST be baked here or the CI build falls back to /neurons/bgm/
          # (gitignored, not deployed) and the radio 404s. gitignored .env.local only
          # covers a local `pnpm deploy:cf`, NOT this CI build.
          VITE_BGM_BASE_URL: https://radio.med-study-rpg.com/
          # 「看原始詳解 PDF」 browser-direct Google Drive auto-fetch
          # (add-neurons-pdf-drive-autofetch). Referrer-restricted NON-secret key;
          # MUST be baked at build time or the prod bundle 403s "key missing". The
          # repo secret VITE_GDRIVE_API_KEY must exist or this bakes empty (gitignored
          # .env.local only covers a local `pnpm deploy:cf`, NOT this CI build).
          VITE_GDRIVE_API_KEY: ${{ secrets.VITE_GDRIVE_API_KEY }}
          # Scaffold has 免疫學 subject with zero questions assigned —
          # content-neurons-tw build script normally errors on orphan subjects
          # but supports the same MEDEXAM_ALLOW_SKIPS=1 escape as
          # content-medexam-tw. Remove this once neurons content fully wired.
          MEDEXAM_ALLOW_SKIPS: '1'
        run: pnpm --filter @study-rpg/neurons-tw build

      - name: Assemble dist-cf
        run: node scripts/build-cf-pages-dist.mjs

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # workingDirectory hops into cloudflare/sync-worker so wrangler-action
          # can locate the wrangler devDep already pinned there — avoids the
          # ERR_PNPM_ADDING_TO_ROOT error that fires when the action tries
          # `pnpm add wrangler` against the monorepo root. The deploy command
          # path is relative to that subdir.
          workingDirectory: cloudflare/sync-worker
          command: pages deploy ../../dist-cf --project-name med-study-rpg --branch main
          packageManager: pnpm
