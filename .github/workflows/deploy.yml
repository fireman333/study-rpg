name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # VITE_APP_VERSION is read from package.json `version` via process.env.npm_package_version
          # inside vite.config.ts when running through pnpm. VITE_COMMIT_SHA carries the git SHA.
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_CLOUD_SYNC_ENABLED: 'true'
          # R2 migration flags (add-r2-cloud-sync-migration). Optional —
          # empty/unset secrets fall through to safe defaults via
          # backend-config.ts + r2/client.ts nonEmpty() guards. Owner adds
          # these to repo Secrets to flip Phase 3 (READ_BACKEND=r2) and
          # Phase 4 (BACKEND=r2) without editing this workflow.
          VITE_CLOUD_SYNC_BACKEND: ${{ secrets.VITE_CLOUD_SYNC_BACKEND }}
          VITE_CLOUD_SYNC_READ_BACKEND: ${{ secrets.VITE_CLOUD_SYNC_READ_BACKEND }}
          VITE_SYNC_WORKER_URL: ${{ secrets.VITE_SYNC_WORKER_URL }}
          # Bake-period flag: surfaces the migration banner that points
          # users at https://med-study-rpg.com/{1st,2nd}/. CF Pages build
          # does NOT set this so the banner stays hidden on the new domain.
          VITE_DEPLOY_TARGET: gh-pages
        run: pnpm --filter @study-rpg/medexam-tw build

      # 二階 (/hospital/) is no longer built or merged here. It ships from its
      # own standalone repo + CF project (med-study-rpg.com/2nd/); the old GH
      # Pages path /study-rpg/hospital/ now 301-redirects there via
      # apps/medexam-tw/public/404.html (split-medexam2-standalone §5.3b/§6).

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/medexam-tw/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
