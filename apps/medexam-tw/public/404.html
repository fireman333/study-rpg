<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>一階國考 RPG</title>
    <script>
      // Single Page Apps for GitHub Pages — MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Encodes the requested path into a query string and redirects to
      // index.html, where the inline restore script in <head> rewrites
      // history back to the clean URL before React Router boots.
      var l = window.location;
      // 二階 moved to a standalone repo + CF project. The old GH Pages path
      // /study-rpg/hospital[/...] now 301-equivalent-redirects (location.replace,
      // no back-button trap) to https://med-study-rpg.com/2nd/. The standalone
      // app is HashRouter, so a hash deep-link (#/bookmarks) is carried as-is and
      // a path-style sub-route is converted to its hash equivalent. 一階
      // BrowserRouter restore logic in the else branch is untouched. See
      // openspec/changes/split-medexam2-standalone (§6) + the modified
      // openspec/specs/deploy-pipeline/spec.md.
      var hospitalMatch = l.pathname.match(/^\/study-rpg\/hospital(?:\/(.*))?$/);
      if (hospitalMatch) {
        var sub = hospitalMatch[1] || '';
        l.replace(
          'https://med-study-rpg.com/2nd/' +
          (l.hash ? l.hash : (sub ? '#/' + sub : ''))
        );
      } else {
        var pathSegmentsToKeep = 1; // matches vite.config.ts base: '/study-rpg/'
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body></body>
</html>
