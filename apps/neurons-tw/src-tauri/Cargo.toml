[package]
name = "neurons-tw"
version = "0.0.1"
description = "Neurons desktop shell (Tauri 2) — local-PDF provenance viewer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
